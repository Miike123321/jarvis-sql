<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S. — SQL-ассистент</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080d16;
      color: #e8eef8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0, #12253a 0, #080d16 58%);
    }

    .app {
      width: min(920px, 100%);
      height: min(760px, calc(100vh - 48px));
      min-height: 420px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #26364b;
      border-radius: 18px;
      background: rgb(12 19 30 / 94%);
      box-shadow: 0 24px 80px #0008;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border-bottom: 1px solid #26364b;
    }

    .orb {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid #57c8f2;
      border-radius: 50%;
      box-shadow: inset 0 0 16px #2bbbe755, 0 0 20px #2bbbe733;
    }

    h1 { margin: 0; font-size: 17px; letter-spacing: .12em; }
    .subtitle { margin-top: 5px; color: #93a6bc; font-size: 13px; }

    #status {
      margin-left: auto;
      color: #93a6bc;
      font-size: 12px;
    }

    #status::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: #f0ad4e;
    }

    #status.connected::before { background: #45d483; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .message {
      max-width: 82%;
      margin: 0 0 16px;
      padding: 13px 16px;
      border: 1px solid #26364b;
      border-radius: 14px;
      background: #111c2a;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.user {
      margin-left: auto;
      border-color: #1b5975;
      background: #103047;
    }

    .message.system { color: #ffce8a; }

    .message.waiting {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #9fb3c9;
    }

    .loading-dots {
      display: inline-flex;
      gap: 4px;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #45bde8;
      animation: loading-pulse 1.2s infinite ease-in-out;
    }

    .loading-dots span:nth-child(2) { animation-delay: .15s; }
    .loading-dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes loading-pulse {
      0%, 60%, 100% { opacity: .35; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-dots span { animation: none; }
    }

    .message pre, #sql-preview {
      overflow-x: auto;
      padding: 12px;
      border: 1px solid #26364b;
      border-radius: 8px;
      background: #080d16;
      color: #b7e7fa;
      white-space: pre;
    }

    .message pre.sql-code, #sql-preview {
      border-color: #23536a;
      box-shadow: inset 3px 0 #28b8dd, 0 0 18px #1387ad1a;
      color: #9ce9bd;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }

    form {
      padding: 18px 24px;
      border-top: 1px solid #26364b;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 76px;
      max-height: 220px;
      resize: vertical;
      padding: 13px 15px;
      border: 1px solid #30445e;
      border-radius: 10px;
      outline: none;
      background: #0a111c;
      color: inherit;
      font: inherit;
      line-height: 1.5;
    }

    textarea:focus { border-color: #45bde8; }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .composer-hint {
      margin-right: auto;
      color: #8194aa;
      font-size: 12px;
    }

    button {
      padding: 11px 17px;
      border: 0;
      border-radius: 10px;
      background: #1687ad;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #20a0ca; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondary { background: #26364b; }
    button.secondary:hover { background: #344a64; }

    dialog {
      width: min(620px, calc(100% - 32px));
      border: 1px solid #30445e;
      border-radius: 14px;
      background: #0c131e;
      color: inherit;
      box-shadow: 0 24px 80px #000a;
    }

    dialog::backdrop { background: #000a; }
    dialog h2 { margin-top: 0; font-size: 19px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .cancel { background: #26364b; }
    .cancel:hover { background: #344a64; }

    @media (max-width: 560px) {
      body { padding: 0; }
      .app { height: 100vh; min-height: 0; border: 0; border-radius: 0; }
      header, form { padding-right: 16px; padding-left: 16px; }
      #messages { padding: 18px 16px; }
      .message { max-width: 92%; }
      .composer-actions { flex-wrap: wrap; }
      .composer-hint { width: 100%; }
      .composer-actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="orb" aria-hidden="true"></div>
      <div>
        <h1>J.A.R.V.I.S.</h1>
        <div class="subtitle">SQL-ассистент</div>
      </div>
      <div id="status" role="status">Подключение...</div>
    </header>
    <section id="messages" aria-live="polite">
      <div class="message">Здравствуйте. Я готов помочь с запросами к базе данных.</div>
    </section>
    <form id="message-form">
      <textarea id="message-input" placeholder="Опишите задачу; Enter добавляет новую строку..." aria-label="Сообщение"></textarea>
      <div class="composer-actions">
        <span class="composer-hint">Отправка — только кнопкой. Можно написать несколько пунктов.</span>
        <button class="secondary" id="paste-button" type="button">Вставить</button>
        <button class="secondary" id="undo-button" type="button" disabled>Отменить</button>
        <button id="send-button" type="submit">Отправить</button>
      </div>
    </form>
  </main>

  <dialog id="ddl-dialog">
    <h2>Подтвердите выполнение SQL</h2>
    <p>Ассистент предлагает выполнить следующий запрос. Проверьте его перед подтверждением.</p>
    <pre id="sql-preview"></pre>
    <div class="dialog-actions">
      <button class="cancel" id="cancel-ddl" type="button">Отмена</button>
      <button id="confirm-ddl" type="button">Выполнить</button>
    </div>
  </dialog>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("message-form");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const pasteButton = document.getElementById("paste-button");
    const undoButton = document.getElementById("undo-button");
    const status = document.getElementById("status");
    const ddlDialog = document.getElementById("ddl-dialog");
    const sqlPreview = document.getElementById("sql-preview");
    const draftHistory = [""];
    let pendingSql = null;
    let pendingDdlToken = null;
    let pendingResponses = 0;
    let waitingIndicator = null;

    function addMessage(text, kind = "bot") {
      const message = document.createElement("div");
      message.className = `message ${kind}`;
      const codePattern = /```([^\n`]*)\n?([\s\S]*?)```/g;
      let cursor = 0;
      let match;
      while ((match = codePattern.exec(text)) !== null) {
        message.append(document.createTextNode(text.slice(cursor, match.index)));
        const code = document.createElement("pre");
        if (match[1].trim().toLowerCase() === "sql") code.classList.add("sql-code");
        code.textContent = match[2].trim();
        message.append(code);
        cursor = codePattern.lastIndex;
      }
      message.append(document.createTextNode(text.slice(cursor)));
      messages.append(message);
      messages.scrollTop = messages.scrollHeight;
    }

    function updateWaitingIndicator() {
      waitingIndicator?.remove();
      waitingIndicator = null;
      if (pendingResponses === 0) return;

      waitingIndicator = document.createElement("div");
      waitingIndicator.className = "message waiting";
      waitingIndicator.setAttribute("role", "status");
      waitingIndicator.setAttribute("aria-label", "J.A.R.V.I.S. готовит ответ");
      waitingIndicator.append(document.createTextNode("J.A.R.V.I.S. готовит ответ"));
      const dots = document.createElement("span");
      dots.className = "loading-dots";
      dots.setAttribute("aria-hidden", "true");
      for (let index = 0; index < 3; index += 1) {
        dots.append(document.createElement("span"));
      }
      waitingIndicator.append(dots);
      messages.append(waitingIndicator);
      messages.scrollTop = messages.scrollHeight;
    }

    function rememberDraft(value) {
      if (draftHistory[draftHistory.length - 1] !== value) {
        draftHistory.push(value);
        if (draftHistory.length > 50) draftHistory.shift();
      }
      undoButton.disabled = draftHistory.length < 2;
    }

    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${protocol}//${location.host}/ws`);

    socket.addEventListener("open", () => {
      status.textContent = "Подключено";
      status.classList.add("connected");
      sendButton.disabled = false;
    });

    socket.addEventListener("close", () => {
      status.textContent = "Соединение закрыто";
      status.classList.remove("connected");
      pendingResponses = 0;
      updateWaitingIndicator();
      sendButton.disabled = true;
      addMessage("Соединение с сервером закрыто. Обновите страницу, чтобы подключиться снова.", "system");
    });

    socket.addEventListener("error", () => {
      status.textContent = "Ошибка соединения";
      status.classList.remove("connected");
    });

    socket.addEventListener("message", (event) => {
      let payload;
      try {
        payload = JSON.parse(event.data);
      } catch {
        pendingResponses = Math.max(0, pendingResponses - 1);
        updateWaitingIndicator();
        addMessage("Сервер прислал некорректный ответ.", "system");
        return;
      }

      if (payload.type === "error") {
        pendingResponses = Math.max(0, pendingResponses - 1);
        updateWaitingIndicator();
        addMessage(typeof payload.message === "string" ? payload.message : "Произошла ошибка.", "system");
        return;
      }
      if (payload.type !== "bot_response" || typeof payload.text !== "string") return;
      pendingResponses = Math.max(0, pendingResponses - 1);
      updateWaitingIndicator();
      const sqlBlock = payload.text.match(/```sql\s*([\s\S]*?)```/i);
      addMessage(payload.text);
      updateWaitingIndicator();
      if (sqlBlock && typeof payload.ddl_token === "string") {
        pendingSql = sqlBlock[1].trim();
        pendingDdlToken = payload.ddl_token;
        sqlPreview.textContent = pendingSql;
        ddlDialog.showModal();
      }
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || socket.readyState !== WebSocket.OPEN) return;
      addMessage(text, "user");
      socket.send(JSON.stringify({ type: "user_message", text }));
      pendingResponses += 1;
      updateWaitingIndicator();
      input.value = "";
      draftHistory.splice(0, draftHistory.length, "");
      undoButton.disabled = true;
      input.focus();
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        const start = input.selectionStart;
        const end = input.selectionEnd;
        input.setRangeText("\n", start, end, "end");
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }
    });

    input.addEventListener("input", () => rememberDraft(input.value));

    undoButton.addEventListener("click", () => {
      if (draftHistory.length < 2) return;
      draftHistory.pop();
      input.value = draftHistory[draftHistory.length - 1];
      undoButton.disabled = draftHistory.length < 2;
      input.focus();
    });

    pasteButton.addEventListener("click", async () => {
      try {
        const clipboardText = await navigator.clipboard.readText();
        const start = input.selectionStart;
        const end = input.selectionEnd;
        input.setRangeText(clipboardText, start, end, "end");
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.focus();
      } catch {
        addMessage("Не удалось прочитать буфер обмена. Проверьте разрешение браузера и попробуйте вставить текст сочетанием клавиш.", "system");
      }
    });

    function respondToDdl(approved) {
      if (!pendingSql || !pendingDdlToken || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: "confirm_ddl", token: pendingDdlToken, approved }));
      pendingResponses += 1;
      updateWaitingIndicator();
      pendingSql = null;
      pendingDdlToken = null;
      ddlDialog.close();
    }

    document.getElementById("confirm-ddl").addEventListener("click", () => respondToDdl(true));
    document.getElementById("cancel-ddl").addEventListener("click", () => respondToDdl(false));
    sendButton.disabled = true;
  </script>
</body>
</html>
